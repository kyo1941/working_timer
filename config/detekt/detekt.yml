# detekt設定ファイル
# buildUponDefaultConfig = true のため、デフォルトから変更するルールのみ記述

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

# -----------------------------------------------------------------------
# コメント
# -----------------------------------------------------------------------
comments:
  active: true
  UndocumentedPublicClass:
    active: false   # Android/Compose では全publicクラスのKDocは過剰
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

# -----------------------------------------------------------------------
# 複雑度
# -----------------------------------------------------------------------
complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 8   # Hilt DI コンストラクタはパラメータが多い（デフォルト6→8）
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated:
      - 'HiltViewModel'
      - 'Inject'
      - 'Composable'
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 10
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true

# -----------------------------------------------------------------------
# コーディング規約
# -----------------------------------------------------------------------
style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '1000'   # ms/秒変換でよく使われる
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreExtensionFunctions: true
  MaxLineLength:
    active: true
    maxLineLength: 140   # Compose UIコードは横に長くなりやすい（デフォルト120→140）
    excludePackageStatements: true
    excludeImportStatements: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'FIXMEコメントは解消してください'
        value: 'FIXME'
    allowedPatterns: ''
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  WildcardImport:
    active: true
    excludeImports:
      - 'kotlinx.coroutines.*'
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.material3.*'

# -----------------------------------------------------------------------
# 命名規則
# -----------------------------------------------------------------------
naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'   # Compose @Composable は大文字始まりを許容
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
    ignoreAnnotated:
      - 'Composable'

# -----------------------------------------------------------------------
# パフォーマンス
# -----------------------------------------------------------------------
performance:
  active: true
  SpreadOperator:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'

# -----------------------------------------------------------------------
# 潜在バグ
# -----------------------------------------------------------------------
potential-bugs:
  active: true
  ImplicitUnitReturnType:
    active: false   # Composable では Unit を省略する書き方が一般的
  UnsafeCallOnNullableType:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  UnsafeCast:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'

# -----------------------------------------------------------------------
# 例外処理
# -----------------------------------------------------------------------
exceptions:
  active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignored)'
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignored)|(expected)'
    excludes:
      - '**/test/**'
      - '**/androidTest/**'

# -----------------------------------------------------------------------
# 空のブロック
# -----------------------------------------------------------------------
empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true   # override fun onXxx() {} は許可
